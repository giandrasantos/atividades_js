<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma JS</title>
</head>
<body>
    <script>
        alert("O programa executará as Operações (+ - * /) entre os números digitados")
        var num1 = parseInt(prompt("Digite 1 número: "));
        var num2 = parseInt(prompt("Digite outro número: "));

        var resultadosoma = num1 + num2;
        document.write("O resultado da soma é: ", resultadosoma);
        document.write("<br>")
        var resultadosubtracao = num1 - num2;
        document.write("O resultado da subtração é: ", resultadosubtracao);
        document.write("<br>")
        var resultadomultiplicacao = num1 * num2;
        document.write("O resultado da multiplicação é: ", resultadomultiplicacao);
        document.write("<br>")
        var resultadodivisao = num1 / num2; 
        document.write("O resultado da divisão é: ", resultadodivisao);

    </script>
</body>
</html>
